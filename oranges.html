<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oranges/Fruits</title>

<style>
    .navbar{
        background-color:orange;
        padding: 15px;
        text-align: center;
        position: sticky;
        top: 0;
    }

    img {
        float: left;
        width: 200px;
        height: 200px;
        margin: 10px;
    }

    .fixed-box{
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: rgb(128, 0, 0);
        color: white;
        padding: 10px;
    }

    .relative-box{
        width: 400px;
        height: 250px;
        background: rgb(238, 144, 144);
        position: relative;
        margin-top: 50px;
        clear: both;
    }

    .absolute-box{
        width: 100px;
        height: 100px;
        background: orange;
        position: absolute;
        top: 20px;
        right: 20px;
        text-align: center;
        line-height: 100px;
        color: white;
    }

    .spacer{
        height: 800px;
    }

    a:link {
  color: rgb(0, 0, 0);
}
a:visited {
  color: rgb(255, 167, 167);
}

a:hover {
  color: rgb(0, 0, 0);
}

a:active {
  color: rgb(0, 0, 0);
}

 .navbar a{
        display: inline-block;
        color: white;
        text-decoration: none;
        padding: 10px 20px;
        margin: 0 5px;
      }

      .navbar a:hover{
        background-color: rgb(0, 0, 0);
        border-radius: 4px;
        color:#eba2a2;
      }
</style>
</head>

<body>

</div>

</div>

</html>
